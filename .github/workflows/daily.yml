# 매일 새벽(한국 시간) 자동 실행: 수집 → 지표 → 검증 → 사이트 배포
# 검증에 실패하면 배포 단계까지 가지 않는다(깨진 데이터가 공개되지 않게).
name: 매일 업데이트와 배포

on:
  schedule:
    - cron: "30 19 * * *"      # UTC 19:30 = 한국 시간 04:30
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = 최근 3개월 / backfill = 과거 채우기(이어받기)"
        type: choice
        options: [daily, backfill]
        default: daily
      weekly:
        description: "주간 알림·AI 글도 지금 만들기"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
      ECOS_KEY: ${{ secrets.ECOS_KEY }}
      RONE_KEY: ${{ secrets.RONE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 테스트
        run: python -m pytest -q

      # backfill = 최근 3개월은 항상 다시 받고 + 아직 못 받은 과거 달을 한도 안에서 이어받는다.
      # 과거를 다 채운 뒤에는 저절로 '최근 3개월만' 받게 된다.
      - name: 수집(최근 3개월 + 남은 과거 이어받기)
        run: python -m pipeline collect --mode ${{ github.event.inputs.mode || 'backfill' }}

      - name: 선택 기능(키가 없으면 자동으로 건너뜀)
        run: |
          python -m pipeline kapt
          python -m pipeline geo
          python -m pipeline macro

      - name: 수집 결과 저장(커밋)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "데이터 갱신 $(date +%F)"
          git push

      - name: 지표 계산과 사이트 데이터 만들기
        run: python -m pipeline build

      - name: 주간 AI 글(월요일 · 키가 있을 때만)
        if: ${{ github.event.inputs.weekly == 'true' || github.event_name == 'schedule' }}
        run: |
          if [ "$(date +%u)" = "1" ] || [ "${{ github.event.inputs.weekly }}" = "true" ]; then python -m pipeline ai-report; fi

      - name: 검증(실패하면 여기서 멈춤 — 배포 안 함)
        run: python -m pipeline validate --no-sample --update

      - name: 검증 기준 저장(커밋)
        run: |
          git add data/state
          git diff --cached --quiet || git commit -m "검증 기준 갱신 $(date +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 텔레그램 알림(설정이 있을 때만)
        run: |
          if [ "$(date +%u)" = "1" ] || [ "${{ github.event.inputs.weekly }}" = "true" ]; then python -m pipeline notify --weekly; else python -m pipeline notify; fi
          git add data/state
          git diff --cached --quiet || git commit -m "알림 기록 $(date +%F)"
          git push

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
