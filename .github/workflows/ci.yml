# 코드가 바뀔 때마다 테스트. 가상 샘플로 전체 흐름(수집 → 지표 → 검증)도 한 번 돌려 본다.
name: 테스트

on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: 가상 샘플로 전체 흐름 확인(1년 치)
        run: python -m pipeline sample --years 1
