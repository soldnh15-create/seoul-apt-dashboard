# 수집·분석 설정. 숫자만 바꾸면 동작이 바뀐다(코드 수정 불필요).

# ── 수집 ─────────────────────────────────────────────
backfill_years: 10          # 처음 채울 기간(년)
refetch_months: 3           # 매일 다시 받는 최근 개월 수(신고기한 30일·정정·해제 반영)
num_of_rows: 1000           # 한 번에 받는 행 수(공식 최대 1000)
daily_call_budget: 9000     # API 1종당 하루 호출 상한(개발계정 10,000/일보다 낮게)
collect_minutes_budget: 150 # 한 번 실행에 수집에 쓸 시간 상한(분). 넘으면 저장하고 멈춘 뒤 다음 실행에서 이어받는다(0 = 제한 없음)
                            # 실측(2026-11-14): 60분에 약 1,840개 달·구 조합(서울 3년치). 자동 실행 제한 시간(daily.yml timeout-minutes)보다 넉넉히 짧게 둔다.
request_interval_sec: 0.12  # 호출 사이 쉬는 시간(초당 호출 제한 대비)
retry_max: 4                # 일시 오류 재시도 횟수
retry_base_sec: 1.5         # 재시도 대기(1.5 → 3 → 6 → 12초)
timeout_sec: 30

# 공식 주소(공공데이터포털 2026-11 확인). 버전이 바뀌면 여기만 고친다.
endpoints:
  trade: https://apis.data.go.kr/1613000/RTMSDataSvcAptTradeDev/getRTMSDataSvcAptTradeDev
  rent: https://apis.data.go.kr/1613000/RTMSDataSvcAptRent/getRTMSDataSvcAptRent
  kapt_list: https://apis.data.go.kr/1613000/AptListService4/getSigunguAptList4
  kapt_basic: https://apis.data.go.kr/1613000/AptBasisInfoServiceV5/getAphusBassInfoV5
  kapt_detail: https://apis.data.go.kr/1613000/AptBasisInfoServiceV5/getAphusDtlInfoV5
kapt_call_budget: 4500      # K-apt 1종당 하루 호출 상한(개발계정 5,000/일)

# ── 지표 ─────────────────────────────────────────────
area_bands:                 # 전용면적 구간(㎡). min 초과 ~ max 이하
  - {key: small, label: "소형(~60㎡)", max: 60}
  - {key: std,   label: "84㎡ 표준(60~85㎡)", min: 60, max: 85}
  - {key: large, label: "중대형(85㎡~)", min: 85}
recent_days: 183            # "최근 시세" 기준 기간(일)
low_floor_max: 3            # 이 층 이하를 저층으로 본다
new_high_min_prior: 3       # 신고가 판정 전 필요한 이전 거래 수
anomaly_direct_discount_pct: 20   # 직거래가 최근 시세보다 이 % 이상 낮으면 표시
anomaly_min_ref_trades: 3
newhigh_list_days: 30       # 신고가·저가 직거래 목록에 넣는 최근 일수
age_bands: [5, 10, 20, 30]  # 연식 구간 경계(년)

# ── 검증(실패하면 배포 중단) ─────────────────────────
validate:
  max_row_drop_pct: 10      # 직전 실행보다 행 수가 이만큼 줄면 실패
  price_min: 500            # 만원. 이보다 싼 매매는 이상치
  price_max: 3000000        # 만원(300억). 이보다 비싼 매매는 이상치
  max_outlier_pct: 0.5      # 이상치 비율 상한(%)
  max_blank_pct: 1.0        # 필수 항목이 빈 행 비율 상한(%)
  max_stale_days: 45        # 최신 거래일이 이보다 오래되면 실패

# ── 선택 기능(키가 없으면 자동으로 꺼진다) ───────────
ecos:                       # 한국은행 ECOS — 통계코드는 실제 키로 확인 필요(미확인)
  base_rate: {stat: "722Y001", cycle: "M", item: "0101000"}
  mortgage_rate: {stat: "121Y006", cycle: "M", item: "BECBLA0302"}
rone:                       # 한국부동산원 R-ONE — 통계표 ID는 실제 키로 확인 필요(미확인)
  url: https://www.reb.or.kr/r-one/openapi/SttsApiTblData.do
  weekly_sale_index: {statbl_id: "", cycle: "WK", itm_id: "", cls_id: ""}
  weekly_jeonse_index: {statbl_id: "", cycle: "WK", itm_id: "", cls_id: ""}
gemini:                     # 위에서부터 차례로 시도(모델 이름이 바뀌어 없어지면 다음 후보로). 실제 키로 확인 전(미확인)
  models: [gemini-2.5-flash, gemini-flash-latest, gemini-2.0-flash]
extras_minutes_budget: 30   # 선택 기능(단지 정보·좌표) 하나가 한 번 실행에 쓸 시간 상한(분). 남은 것은 다음 실행에서 이어받는다
